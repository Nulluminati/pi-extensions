name: CI

# Run on direct pushes to main and on every pull request targeting main.
# This catches regressions from both human commits and Dependabot PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token is enough for `npm run check` (lint, typecheck, validate, test).
permissions:
  contents: read

# Cancel in-progress runs for the same ref so a force-push doesn't queue stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run full check
        run: npm run check
