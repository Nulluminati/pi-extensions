name: CI

# Run on direct pushes to main and on every pull request targeting main.
# This catches regressions from both human commits and Dependabot PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token is enough for both jobs below.
permissions:
  contents: read

# Cancel in-progress runs for the same ref so a force-push doesn't queue stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, validate, test
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Bun for sandbox client tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # The worker sandbox runs tools under bubblewrap, which needs socat and
      # ripgrep too. Ubuntu's AppArmor blocks the unprivileged user namespaces
      # that bubblewrap creates, so the runner lifts that restriction.
      #
      # Newer Ubuntu releases also load the bwrap-userns-restrict profile. It
      # moves bubblewrap's children to a profile without capabilities, so the
      # sandbox's apply-seccomp helper cannot set up its nested user namespace
      # (write /proc/self/setgroups fails). The sysctl does not affect that
      # profile, so the runner unloads it when it is present.
      - name: Install sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          profile=/etc/apparmor.d/bwrap-userns-restrict
          if [ -f "$profile" ]; then
            sudo apparmor_parser -R "$profile"
          fi
          sudo aa-status | grep -i bwrap || echo "No bwrap AppArmor profiles loaded"

      - name: Install dependencies
        run: npm ci

      - name: Run full check
        run: npm run check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Dependabot does not track this download. Update the version and the
      # checksum together, from gitleaks_<version>_checksums.txt.
      # Top-level [[allowlists]] require Gitleaks 8.25.0 or later.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Gitleaks needs the full history to detect past leaks.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # gitleaks reads .gitleaks.toml from the repository root.
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'

      - name: Setup Node.js for secret scan regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Test secret scan exceptions
        run: GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" npm run test:secrets
