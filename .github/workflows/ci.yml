name: CI

# Run on direct pushes to main and on every pull request targeting main.
# This catches regressions from both human commits and Dependabot PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token is enough for both jobs below. pull-requests: read lets
# gitleaks-action's ScanPullRequest mode fetch the PR's commits to scan just
# the diff (it calls /pulls/{n}/commits, which 403s without this scope).
permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs for the same ref so a force-push doesn't queue stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, validate, test
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Bun for sandbox client tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The worker sandbox runs tools under bubblewrap, which needs socat and
      # ripgrep too. Ubuntu's AppArmor blocks the unprivileged user namespaces
      # that bubblewrap creates, so the runner lifts that restriction.
      #
      # Newer Ubuntu releases also load the bwrap-userns-restrict profile. It
      # moves bubblewrap's children to a profile without capabilities, so the
      # sandbox's apply-seccomp helper cannot set up its nested user namespace
      # (write /proc/self/setgroups fails). The sysctl does not affect that
      # profile, so the runner unloads it when it is present.
      - name: Install sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          profile=/etc/apparmor.d/bwrap-userns-restrict
          if [ -f "$profile" ]; then
            sudo apparmor_parser -R "$profile"
          fi
          sudo aa-status | grep -i bwrap || echo "No bwrap AppArmor profiles loaded"

      - name: Install dependencies
        run: npm ci

      - name: Run full check
        run: npm run check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Gitleaks needs the full history to detect past leaks.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Top-level [[allowlists]] require Gitleaks 8.25.0 or later.
          GITLEAKS_VERSION: "8.30.1"
          # The action fails the job on any leak by default. GITHUB_TOKEN
          # is required for the action to post annotations on the PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fork pull requests have read-only tokens. Report findings in the
          # job without attempting to write review comments.
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Setup Node.js for secret scan regression tests
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # gitleaks-action adds its installed scanner to PATH.
      - name: Test secret scan exceptions
        run: npm run test:secrets
