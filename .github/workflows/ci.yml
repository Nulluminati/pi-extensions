name: CI

# Run on direct pushes to main and on every pull request targeting main.
# This catches regressions from both human commits and Dependabot PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token is enough for both jobs below.
permissions:
  contents: read

# Cancel in-progress runs for the same ref so a force-push doesn't queue stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run full check
        run: npm run check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks needs the full history to detect past leaks.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action fails the job on any leak by default. GITHUB_TOKEN
          # is required for the action to post annotations on the PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
