# Gitleaks configuration
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

# Use the bundled default ruleset. The rules cover ~150 common token
# formats (GitHub PATs, AWS keys, Stripe, OpenAI, Anthropic, etc.) and
# are kept current by the gitleaks project.
# https://github.com/gitleaks/gitleaks/tree/master/config
[extend]
useDefault = true

# Repository title shown in gitleaks output.
title = "pi-extensions"

# Sourcegraph access tokens are bare 40-char hex strings. Match only the
# synthetic SHA in the code-search fixture, not other secrets on its line.
[[allowlists]]
description = "Fake commit SHA in code-search fixture"
regexTarget = "secret"
regexes = [
  '''^48c6663a66b7eacbd9c7c411863ab5d18dbeea88$''',
]
